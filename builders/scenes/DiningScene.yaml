# DiningSceneV2.yaml - Table with chairs using constraint-based placement
version: "1.0"
name: DiningScene
description: Table with chairs - no overlaps
quality:
  target_tier: 2
  current_tier: 1
  tier_gaps:
    - "Scene quality depends entirely on child builders (Table, DiningChair)"
    - "Chair placement is rectangular only - no round-table radial placement"
    - "No decorative objects (centerpiece, placemats)"
    - "Single fixed floor level"
  parts:
    table:
      tier: 1
      notes: "Composed Table builder. Quality depends on Table.yaml"
    chairs:
      tier: 1
      notes: "Placed DiningChair instances. Quality depends on DiningChair.yaml"
  decision_coverage:
    geometry_affecting:
      - chair_count       # Number of chairs placed
      - table_style       # Passed to Table (rectangular/round)
      - chair_back_style  # Passed to DiningChair
      - chair_leg_style   # Passed to DiningChair
      - chair_seat_shape  # Passed to DiningChair
      - chair_has_stretchers  # Passed to DiningChair
      - chair_leg_taper   # Passed to DiningChair
      - chair_back_recline    # Passed to DiningChair
      - chair_seat_curve  # Passed to DiningChair
      - table_width_var   # Passed to Table
      - table_depth_var   # Passed to Table
    decorative_only: []
    coverage_percentage: 100
  upgrade_path:
    to_tier_2:
      - "Add radial placement for round table style"
      - "Add decorative objects (vase centerpiece, placemats)"
      - "Upgrade child builders to Tier 2"

decisions:
  chair_count:
    type: count
    min: 2
    max: 6
  table_style:
    type: choice
    options: [rectangular, round]
  chair_back_style:
    type: choice
    options: [solid, slat, ladder]
  chair_leg_style:
    type: choice
    options: [round, square, tapered]
  chair_seat_shape:
    type: choice
    options: [square, rounded, contoured]
  chair_has_stretchers:
    type: boolean
    probability: 0.4
  chair_leg_taper:
    type: number
    min: 0.7
    max: 0.9
  chair_back_recline:
    type: number
    min: 3.0
    max: 7.0
  chair_seat_curve:
    type: number
    min: 0.005
    max: 0.015
  table_width_var:
    type: number
    min: -0.2
    max: 0.3
  table_depth_var:
    type: number
    min: -0.1
    max: 0.2
measurements:
  table_width:
    base: 1.2
    variation: table_width_var
  table_depth:
    base: 0.8
    variation: table_depth_var
  chair_width:
    value: 0.45
  chair_depth:
    value: 0.45
  min_chair_gap:
    value: 0.05
derived:
  table_radius: "table_width / 2"
  min_chair_distance: "chair_width + min_chair_gap"
compose:
  table:
    builder: Table
    offset: { x: 0, y: 0, z: 0 }
    overrides:
      table_style: $table_style
      table_width: $table_width
      table_depth: $table_depth
placement:
  mode: around_rectangle
  center: { x: 0, y: 0, z: 0 }
  width: table_width
  depth: table_depth
  builder: DiningChair
  count: chair_count
  minDistance: min_chair_distance
  allowReducedCount: true
  instancePrefix: chair
  overrides:
    back_style: $chair_back_style
    leg_style: $chair_leg_style
    seat_shape: $chair_seat_shape
    has_stretchers: $chair_has_stretchers
    leg_taper: $chair_leg_taper
    back_recline: $chair_back_recline
    seat_curve: $chair_seat_curve
    width_variation: 0
    depth_variation: 0
    back_height_variation: 0
