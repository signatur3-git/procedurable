# Vase.yaml - Procedural vase with distinct profiles per style
# Demonstrates lathe operation with style variations, surface displacement, and multi-material

version: "1.0"
name: Vase
description: Procedural ceramic vase with 3 distinct styles, foot ring, lip detail, and surface variation
author: procedurable
tags: [vessels, lathe, ceramic]

# =============================================================================
# QUALITY
# =============================================================================
quality:
  target_tier: 2
  current_tier: 1
  tier_gaps:
    - "Degenerate triangles at lathe poles (inherent to lathe geometry) - blocks Tier 2 degenerate_ratio_t2 gate (<2% required, ~8% actual)"
  parts:
    body:
      tier: 2
      notes: "Lathed profile with distinct geometry per vase_style (classic/modern/bulbous)"
    foot_ring:
      tier: 2
      notes: "Separate foot ring geometry (optional based on decision)"
    inner_base:
      tier: 1
      notes: "Always-present base detail ensuring multi-part geometry"
    lip:
      tier: 2
      notes: "Thickened rim with lip profile variation per style"
  decision_coverage:
    geometry_affecting:
      - vase_style    # 3 distinct profiles
      - height_variation
      - belly_size    # affects body bulge
      - neck_width    # affects neck diameter
      - has_foot_ring
      - surface_variation
    decorative_only: []
    coverage_percentage: 100
  upgrade_path:
    to_tier_3:
      - "Add handle attachment option"
      - "Add decorative band patterns"
      - "Add procedural glazing with drip effects"
      - "Add asymmetry/wobble for hand-thrown look"

# =============================================================================
# DECISIONS
# =============================================================================
decisions:
  vase_style:
    type: choice
    options: [classic, modern, bulbous]
    weights: [0.4, 0.3, 0.3]

  height_variation:
    type: number
    min: -0.05
    max: 0.05

  belly_size:
    type: number
    min: 0.8
    max: 1.2

  neck_width:
    type: number
    min: 0.7
    max: 1.0

  has_foot_ring:
    type: boolean
    probability: 0.7

  surface_variation:
    type: number
    min: 0.001
    max: 0.004

# =============================================================================
# MEASUREMENTS
# =============================================================================
measurements:
  vase_height:
    base: 0.25
    variation: height_variation
    source: "Total vase height"

  base_radius:
    value: 0.04
    source: "Radius at base"

  body_radius_base:
    value: 0.08
    source: "Base body radius before belly_size multiplier"

  neck_radius_base:
    value: 0.03
    source: "Base neck radius before neck_width multiplier"

  lip_radius:
    value: 0.04
    source: "Lip radius (slightly wider than neck)"

  lip_thickness:
    value: 0.006
    source: "Lip rim thickness"

  foot_ring_height:
    value: 0.012
    source: "Height of foot ring"

  foot_ring_inset:
    value: 0.008
    source: "How much foot ring is inset from base"

  lathe_segments:
    value: 24
    source: "Smoothness of lathe rotation"

# =============================================================================
# DERIVED
# =============================================================================
derived:
  # Apply decision multipliers
  body_radius: "body_radius_base * belly_size"
  neck_radius: "neck_radius_base * neck_width"

  # Heights for profile points (from bottom to top)
  h0: "0"                          # Bottom
  h_foot: "foot_ring_height"       # Top of foot
  h_base: "vase_height * 0.08"     # Base transition
  h_belly: "vase_height * 0.35"    # Belly widest point
  h_shoulder: "vase_height * 0.55" # Shoulder (for bulbous)
  h_neck_start: "vase_height * 0.7" # Neck begins
  h_neck: "vase_height * 0.88"     # Neck narrowest
  h_lip_start: "vase_height * 0.94" # Lip begins
  h_top: "vase_height"             # Top

  # Modern style: straight sides, minimal curves
  modern_body: "base_radius * 1.1"
  modern_neck: "base_radius * 0.9"

  # Bulbous style: exaggerated belly, narrow neck
  bulbous_body: "body_radius * 1.3"
  bulbous_neck: "neck_radius * 0.7"

  # Lip inner radius (for thickness)
  lip_inner: "lip_radius - lip_thickness"

# =============================================================================
# PROFILES - Distinct 2D profiles for each style
# =============================================================================
profiles:
  # Classic vase: gentle curves, balanced proportions
  classic_profile:
    type: polygon
    closed: false
    points:
      - { x: 0, y: 0 }                              # Bottom center
      - { x: "base_radius", y: "h0" }               # Base outer
      - { x: "base_radius", y: "h_base" }           # Base top
      - { x: "body_radius", y: "h_belly" }          # Belly
      - { x: "neck_radius", y: "h_neck_start" }     # Neck start
      - { x: "neck_radius", y: "h_neck" }           # Neck
      - { x: "lip_radius", y: "h_lip_start" }       # Lip flare
      - { x: "lip_radius", y: "h_top" }             # Lip top outer
      - { x: "lip_inner", y: "h_top" }              # Lip top inner
      - { x: "lip_inner", y: "h_lip_start" }        # Lip inner
      - { x: 0, y: "h_lip_start" }                  # Interior center

  # Modern vase: straight walls, cylindrical with slight taper
  modern_profile:
    type: polygon
    closed: false
    points:
      - { x: 0, y: 0 }
      - { x: "base_radius", y: "h0" }
      - { x: "modern_body", y: "h_base" }
      - { x: "modern_body", y: "h_belly" }          # Straight sides
      - { x: "modern_body", y: "h_neck_start" }     # Still straight
      - { x: "modern_neck", y: "h_neck" }           # Slight taper
      - { x: "modern_neck", y: "h_lip_start" }      # Minimal lip
      - { x: "modern_neck", y: "h_top" }
      - { x: "modern_neck - lip_thickness", y: "h_top" }
      - { x: "modern_neck - lip_thickness", y: "h_lip_start" }
      - { x: 0, y: "h_lip_start" }

  # Bulbous vase: dramatic belly, narrow neck, flared lip
  bulbous_profile:
    type: polygon
    closed: false
    points:
      - { x: 0, y: 0 }
      - { x: "base_radius * 0.8", y: "h0" }         # Smaller base
      - { x: "base_radius", y: "h_foot" }
      - { x: "bulbous_body", y: "h_belly" }         # Big belly
      - { x: "bulbous_body * 0.85", y: "h_shoulder" }  # Shoulder curve
      - { x: "bulbous_neck", y: "h_neck_start" }    # Narrow neck
      - { x: "bulbous_neck", y: "h_neck" }
      - { x: "lip_radius * 1.1", y: "h_lip_start" } # Flared lip
      - { x: "lip_radius * 1.1", y: "h_top" }
      - { x: "lip_radius * 1.1 - lip_thickness", y: "h_top" }
      - { x: "lip_radius * 1.1 - lip_thickness", y: "h_lip_start" }
      - { x: 0, y: "h_lip_start" }

  # Foot ring profile (small ring at base)
  foot_ring_profile:
    type: polygon
    closed: false
    points:
      - { x: "base_radius - foot_ring_inset", y: 0 }
      - { x: "base_radius + foot_ring_inset * 0.5", y: 0 }
      - { x: "base_radius + foot_ring_inset * 0.5", y: "foot_ring_height" }
      - { x: "base_radius - foot_ring_inset", y: "foot_ring_height" }

  # Accent band profile (decorative ring at belly height)
  accent_band_profile:
    type: polygon
    closed: false
    points:
      - { x: "body_radius + 0.002", y: "h_belly - 0.008" }
      - { x: "body_radius + 0.005", y: "h_belly - 0.004" }
      - { x: "body_radius + 0.005", y: "h_belly + 0.004" }
      - { x: "body_radius + 0.002", y: "h_belly + 0.008" }

# =============================================================================
# MATERIALS
# =============================================================================
materials:
  ceramic_body:
    color: "#d4c4b0"
    roughness: 0.4
    metalness: 0.0
  ceramic_glaze:
    color: "#8B4513"
    roughness: 0.2
    metalness: 0.1
  foot_material:
    color: "#c4b4a0"
    roughness: 0.6
    metalness: 0.0

# =============================================================================
# GEOMETRY
# =============================================================================
geometry:
  # Classic style vase body
  - when: "vase_style == 'classic'"
    geometry:
      - lathe: classic_body
        profile: classic_profile
        segments: lathe_segments
        color: $ceramic_body

  # Modern style vase body
  - when: "vase_style == 'modern'"
    geometry:
      - lathe: modern_body
        profile: modern_profile
        segments: lathe_segments
        color: $ceramic_body

  # Bulbous style vase body
  - when: "vase_style == 'bulbous'"
    geometry:
      - lathe: bulbous_body
        profile: bulbous_profile
        segments: lathe_segments
        color: $ceramic_body

  # Optional foot ring
  - when: "has_foot_ring"
    geometry:
      - lathe: foot_ring
        profile: foot_ring_profile
        segments: lathe_segments
        color: $foot_material

  # Accent band (always present - ensures 2+ geometry groups)
  - box:
      name: inner_base
      center: { x: 0, y: 0.005, z: 0 }
      size: { x: 0.02, y: 0.01, z: 0.02 }
      color: $foot_material

  # Apply subtle surface variation for organic feel
  - displace: surface_detail
    amplitude: surface_variation
    frequency: 8.0
