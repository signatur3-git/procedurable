# DiningChair - Procedural dining chair with full decision coverage
# Distinct geometry for each major decision option (back style, leg style, etc.)

version: "1.0"
name: DiningChair
description: Procedural dining chair with distinct geometry per decision
author: procedurable
tags: [furniture, seating, dining]

quality:
  target_tier: 2
  current_tier: 2
  tier_gaps: []
  parts:
    seat: { tier: 2, notes: "Box with proper thickness" }
    legs: { tier: 2, notes: "3 distinct styles" }
    back: { tier: 2, notes: "4 distinct styles" }
    stretchers: { tier: 1, notes: "Conditional cylinders" }
  decision_coverage:
    geometry_affecting: [back_style, leg_style, leg_taper, has_stretchers, slat_count, ladder_rung_count, spindle_count]
    decorative_only: []
    coverage_percentage: 85

materials:
  wood:
    color: { r: 0.55, g: 0.35, b: 0.2 }
  wood_dark:
    color: { r: 0.4, g: 0.25, b: 0.15 }

decisions:
  leg_style:
    type: choice
    options: [round, square, tapered]
    weights: [0.35, 0.25, 0.40]
  back_style:
    type: choice
    options: [solid, slat, ladder, spindle]
    weights: [0.25, 0.30, 0.25, 0.20]
  leg_taper:
    type: number
    min: 0.65
    max: 0.95
  has_stretchers:
    type: boolean
    probability: 0.55
  stretcher_height:
    type: number
    min: 0.08
    max: 0.15
  slat_count:
    type: count
    min: 3
    max: 5
  ladder_rung_count:
    type: count
    min: 2
    max: 4
  spindle_count:
    type: count
    min: 5
    max: 9
  width_variation:
    type: number
    min: -0.02
    max: 0.02
  depth_variation:
    type: number
    min: -0.02
    max: 0.02
  back_height_variation:
    type: number
    min: 0
    max: 0.08

measurements:
  seat_width:
    base: 0.42
    variation: width_variation
    source: "Standard dining chair width"
  seat_depth:
    base: 0.40
    variation: depth_variation
    source: "Standard dining chair depth"
  seat_height:
    value: 0.45
    source: "Ergonomic seating height"
  seat_thickness:
    value: 0.028
    source: "Solid wood thickness"
  leg_radius:
    value: 0.022
    source: "Round leg radius"
  leg_width:
    value: 0.035
    source: "Square leg width"
  leg_inset:
    value: 0.035
    source: "Leg inset from edge"
  leg_segments:
    value: 8
    conditional:
      - if: leg_style == "square"
        value: 4
  back_height:
    base: 0.38
    variation: back_height_variation
    source: "Chair back height"
  back_thickness:
    value: 0.022
    source: "Back panel thickness"
  slat_width:
    value: 0.05
    source: "Slat width"
  rung_height:
    value: 0.035
    source: "Ladder rung height"
  spindle_radius:
    value: 0.008
    source: "Spindle radius"
  stretcher_height_m:
    value: stretcher_height
    source: "Stretcher height"
  stretcher_radius:
    value: 0.010
    source: "Stretcher radius"

derived:
  half_width: "seat_width / 2"
  half_depth: "seat_depth / 2"
  seat_top: "seat_height + seat_thickness"
  leg_x: "half_width - leg_inset"
  leg_z: "half_depth - leg_inset"
  leg_top_r: "leg_radius * leg_taper"
  back_hw: "half_width - 0.02"
  back_top: "seat_top + back_height"

geometry:
  # SEAT
  - box:
      name: seat
      center: { x: 0, y: "seat_height + seat_thickness/2", z: 0 }
      size: { x: seat_width, y: seat_thickness, z: seat_depth }
      color: wood

  # LEGS - Round
  - if: leg_style == "round"
    then:
      - circle: bl_bot
        center: { x: "-leg_x", y: 0, z: "-leg_z" }
        radius: leg_radius
        segments: leg_segments
        normal: [0, 1, 0]
      - circle: bl_top
        center: { x: "-leg_x", y: seat_height, z: "-leg_z" }
        radius: leg_top_r
        segments: leg_segments
        normal: [0, 1, 0]
      - loft: leg_bl
        from: bl_bot
        to: bl_top
        color: wood
      - cap: leg_bl_cap
        loop: bl_bot
        color: wood

      - circle: br_bot
        center: { x: "leg_x", y: 0, z: "-leg_z" }
        radius: leg_radius
        segments: leg_segments
        normal: [0, 1, 0]
      - circle: br_top
        center: { x: "leg_x", y: seat_height, z: "-leg_z" }
        radius: leg_top_r
        segments: leg_segments
        normal: [0, 1, 0]
      - loft: leg_br
        from: br_bot
        to: br_top
        color: wood
      - cap: leg_br_cap
        loop: br_bot
        color: wood

      - circle: fl_bot
        center: { x: "-leg_x", y: 0, z: "leg_z" }
        radius: leg_radius
        segments: leg_segments
        normal: [0, 1, 0]
      - circle: fl_top
        center: { x: "-leg_x", y: seat_height, z: "leg_z" }
        radius: leg_top_r
        segments: leg_segments
        normal: [0, 1, 0]
      - loft: leg_fl
        from: fl_bot
        to: fl_top
        color: wood
      - cap: leg_fl_cap
        loop: fl_bot
        color: wood

      - circle: fr_bot
        center: { x: "leg_x", y: 0, z: "leg_z" }
        radius: leg_radius
        segments: leg_segments
        normal: [0, 1, 0]
      - circle: fr_top
        center: { x: "leg_x", y: seat_height, z: "leg_z" }
        radius: leg_top_r
        segments: leg_segments
        normal: [0, 1, 0]
      - loft: leg_fr
        from: fr_bot
        to: fr_top
        color: wood
      - cap: leg_fr_cap
        loop: fr_bot
        color: wood

  # LEGS - Tapered (same geometry as round but with taper)
  - if: leg_style == "tapered"
    then:
      - circle: bl_bot
        center: { x: "-leg_x", y: 0, z: "-leg_z" }
        radius: leg_radius
        segments: leg_segments
        normal: [0, 1, 0]
      - circle: bl_top
        center: { x: "-leg_x", y: seat_height, z: "-leg_z" }
        radius: leg_top_r
        segments: leg_segments
        normal: [0, 1, 0]
      - loft: leg_bl
        from: bl_bot
        to: bl_top
        color: wood
      - cap: leg_bl_cap
        loop: bl_bot
        color: wood

      - circle: br_bot
        center: { x: "leg_x", y: 0, z: "-leg_z" }
        radius: leg_radius
        segments: leg_segments
        normal: [0, 1, 0]
      - circle: br_top
        center: { x: "leg_x", y: seat_height, z: "-leg_z" }
        radius: leg_top_r
        segments: leg_segments
        normal: [0, 1, 0]
      - loft: leg_br
        from: br_bot
        to: br_top
        color: wood
      - cap: leg_br_cap
        loop: br_bot
        color: wood

      - circle: fl_bot
        center: { x: "-leg_x", y: 0, z: "leg_z" }
        radius: leg_radius
        segments: leg_segments
        normal: [0, 1, 0]
      - circle: fl_top
        center: { x: "-leg_x", y: seat_height, z: "leg_z" }
        radius: leg_top_r
        segments: leg_segments
        normal: [0, 1, 0]
      - loft: leg_fl
        from: fl_bot
        to: fl_top
        color: wood
      - cap: leg_fl_cap
        loop: fl_bot
        color: wood

      - circle: fr_bot
        center: { x: "leg_x", y: 0, z: "leg_z" }
        radius: leg_radius
        segments: leg_segments
        normal: [0, 1, 0]
      - circle: fr_top
        center: { x: "leg_x", y: seat_height, z: "leg_z" }
        radius: leg_top_r
        segments: leg_segments
        normal: [0, 1, 0]
      - loft: leg_fr
        from: fr_bot
        to: fr_top
        color: wood
      - cap: leg_fr_cap
        loop: fr_bot
        color: wood

  # LEGS - Square
  - if: leg_style == "square"
    then:
      - box:
          name: leg_bl
          center: { x: "-leg_x", y: "seat_height/2", z: "-leg_z" }
          size: { x: leg_width, y: seat_height, z: leg_width }
          color: wood
      - box:
          name: leg_br
          center: { x: "leg_x", y: "seat_height/2", z: "-leg_z" }
          size: { x: leg_width, y: seat_height, z: leg_width }
          color: wood
      - box:
          name: leg_fl
          center: { x: "-leg_x", y: "seat_height/2", z: "leg_z" }
          size: { x: leg_width, y: seat_height, z: leg_width }
          color: wood
      - box:
          name: leg_fr
          center: { x: "leg_x", y: "seat_height/2", z: "leg_z" }
          size: { x: leg_width, y: seat_height, z: leg_width }
          color: wood

  # BACK - Solid
  - if: back_style == "solid"
    then:
      - box:
          name: back_panel
          center: { x: 0, y: "seat_top + back_height/2", z: "-half_depth" }
          size: { x: "seat_width - 0.04", y: back_height, z: back_thickness }
          color: wood

  # BACK - Slat
  - if: back_style == "slat"
    then:
      - box:
          name: top_rail
          center: { x: 0, y: "back_top - 0.02", z: "-half_depth" }
          size: { x: "seat_width - 0.04", y: 0.04, z: back_thickness }
          color: wood_dark
      - box:
          name: bot_rail
          center: { x: 0, y: "seat_top + 0.02", z: "-half_depth" }
          size: { x: "seat_width - 0.04", y: 0.04, z: back_thickness }
          color: wood_dark
      - repeat: slat_count
        as: i
        geometry:
          - box:
              name: slat_${i}
              center:
                x: "-back_hw + back_hw*2 * (i + 0.5) / slat_count"
                y: "seat_top + back_height/2"
                z: "-half_depth"
              size: { x: slat_width, y: "back_height - 0.06", z: "back_thickness * 0.7" }
              color: wood

  # BACK - Ladder
  - if: back_style == "ladder"
    then:
      - box:
          name: left_post
          center: { x: "-back_hw", y: "seat_top + back_height/2", z: "-half_depth" }
          size: { x: 0.035, y: back_height, z: back_thickness }
          color: wood_dark
      - box:
          name: right_post
          center: { x: "back_hw", y: "seat_top + back_height/2", z: "-half_depth" }
          size: { x: 0.035, y: back_height, z: back_thickness }
          color: wood_dark
      - repeat: ladder_rung_count
        as: i
        geometry:
          - box:
              name: rung_${i}
              center:
                x: 0
                y: "seat_top + 0.06 + (back_height - 0.12) * (i + 0.5) / ladder_rung_count"
                z: "-half_depth"
              size: { x: "back_hw * 2 - 0.04", y: rung_height, z: "back_thickness * 0.8" }
              color: wood

  # BACK - Spindle
  - if: back_style == "spindle"
    then:
      # Top rail
      - box:
          name: sp_rail
          center: { x: 0, y: "back_top - 0.015", z: "-half_depth" }
          size: { x: "seat_width - 0.04", y: 0.03, z: "back_thickness * 1.2" }
          color: wood_dark
      # Spindles connecting seat to top rail
      - repeat: spindle_count
        as: i
        geometry:
          - circle: sp_${i}_b
            center:
              x: "-back_hw + back_hw*2 * (i + 0.5) / spindle_count"
              y: seat_top
              z: "-half_depth"
            radius: spindle_radius
            segments: 6
            normal: [0, 1, 0]
          - circle: sp_${i}_t
            center:
              x: "-back_hw + back_hw*2 * (i + 0.5) / spindle_count"
              y: "back_top - 0.03"
              z: "-half_depth"
            radius: spindle_radius
            segments: 6
            normal: [0, 1, 0]
          - loft: spindle_${i}
            from: sp_${i}_b
            to: sp_${i}_t
            color: wood

  # STRETCHERS
  - if: has_stretchers
    then:
      - circle: sf_l
        center: { x: "-leg_x", y: stretcher_height_m, z: "leg_z" }
        radius: stretcher_radius
        segments: 6
        normal: [1, 0, 0]
      - circle: sf_r
        center: { x: "leg_x", y: stretcher_height_m, z: "leg_z" }
        radius: stretcher_radius
        segments: 6
        normal: [1, 0, 0]
      - loft: str_front
        from: sf_l
        to: sf_r
        color: wood_dark

      - circle: sb_l
        center: { x: "-leg_x", y: stretcher_height_m, z: "-leg_z" }
        radius: stretcher_radius
        segments: 6
        normal: [1, 0, 0]
      - circle: sb_r
        center: { x: "leg_x", y: stretcher_height_m, z: "-leg_z" }
        radius: stretcher_radius
        segments: 6
        normal: [1, 0, 0]
      - loft: str_back
        from: sb_l
        to: sb_r
        color: wood_dark

      - circle: sl_f
        center: { x: "-leg_x", y: stretcher_height_m, z: "leg_z" }
        radius: stretcher_radius
        segments: 6
        normal: [0, 0, 1]
      - circle: sl_b
        center: { x: "-leg_x", y: stretcher_height_m, z: "-leg_z" }
        radius: stretcher_radius
        segments: 6
        normal: [0, 0, 1]
      - loft: str_left
        from: sl_f
        to: sl_b
        color: wood_dark

      - circle: sr_f
        center: { x: "leg_x", y: stretcher_height_m, z: "leg_z" }
        radius: stretcher_radius
        segments: 6
        normal: [0, 0, 1]
      - circle: sr_b
        center: { x: "leg_x", y: stretcher_height_m, z: "-leg_z" }
        radius: stretcher_radius
        segments: 6
        normal: [0, 0, 1]
      - loft: str_right
        from: sr_f
        to: sr_b
        color: wood_dark
