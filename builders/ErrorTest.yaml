# ErrorTest.yaml - Test builder with intentional errors for error context testing
version: "1.0"
name: ErrorTest
description: Builder with errors to test error message context
tags: [test, error-handling]

decisions:
  bad_decision:
    type: number
    min: 10  # This is bad - min > max
    max: 5   # This should trigger an error

measurements:
  good_measurement:
    value: 1.0
    source: "A valid measurement"

  bad_measurement:
    # Missing value or base - should error
    source: "This will fail"

derived:
  good_derived: "good_measurement * 2"

  bad_derived: "undefined_var * 3"  # References undefined variable

geometry:
  - vertex: v1
    position: { x: 0, y: 0, z: 0 }

  - vertex: v2
    position: { x: "bad_expression +", y: 0, z: 0 }  # Bad expression

