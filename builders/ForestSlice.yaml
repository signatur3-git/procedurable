name: ForestSlice
description: Demonstrates instancing output for world-scale scenes
# Webhook test - this should trigger a hot reload notification

decisions:
  tree_count:
    type: count
    min: 5
    max: 15

measurements:
  forest_width:
    value: 20
    variation: "random(10, 30)"
  forest_depth:
    value: 20
    variation: "random(10, 30)"

derived:
  half_width: "forest_width / 2"
  half_depth: "forest_depth / 2"

# Ground plane (merged geometry)
geometry:
  - vertex: ground_bl
    position: { x: "-half_width", y: 0, z: "-half_depth" }
  - vertex: ground_br
    position: { x: "half_width", y: 0, z: "-half_depth" }
  - vertex: ground_tl
    position: { x: "-half_width", y: 0, z: "half_depth" }
  - vertex: ground_tr
    position: { x: "half_width", y: 0, z: "half_depth" }
  - face: ground_surface
    vertices: [ground_bl, ground_br, ground_tr, ground_tl]
    color: { name: olive }

# Trees scattered on the ground (instanced, not merged)
placement:
  mode: scatter_poisson
  builder: Tree  # Changed from TreeScatter - Tree has no ground plane
  count: "tree_count"
  width: "forest_width"
  depth: "forest_depth"
  center: { x: 0, y: 0, z: 0 }  # Center at origin (ground plane is centered)
  minDistance: 1.5
  instancePrefix: tree
  asInstance: true  # Output as instances, don't merge meshes
  overrides:
    trunk_height: 2.5
    trunk_width: 0.5

