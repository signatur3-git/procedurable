# WorldSlice.yaml - Comprehensive World Generation Demo
# Demonstrates: Scalar Fields + Poisson Scatter + Instancing + Coordinate-based Generation
version: "1.0"
name: WorldSlice
description: Demonstrates complete world generation - terrain height variation, natural scatter, and efficient instancing
tags: [demo, world, scatter, poisson, instancing, terrain]

quality:
  target_tier: 1
  current_tier: 0
  tier_gaps:
    - "Ground is flat despite terrain_frequency/terrain_amplitude decisions being declared"
    - "Tree and Rock instances are both boxes"
    - "terrain_frequency and terrain_amplitude only partially used (amplitude in derived but not applied to vertices)"
  parts:
    ground:
      tier: 0
      notes: "Flat ground plane. Terrain variation declared but not applied"
    trees:
      tier: 0
      notes: "Poisson-scattered Tree instances (boxes)"
    rocks:
      tier: 0
      notes: "Poisson-scattered Rock instances (boxes)"
  decision_coverage:
    geometry_affecting:
      - slice_size      # Changes ground size and scatter area
      - tree_density    # Controls tree scatter count
      - rock_density    # Controls rock scatter count
    decorative_only:
      - terrain_frequency   # Declared, used in derived but ground stays flat
      - terrain_amplitude   # Same - derived value exists but not applied to mesh
    coverage_percentage: 60
  upgrade_path:
    to_tier_1:
      - "Apply terrain height via scalar field displacement to subdivided ground mesh"
      - "Upgrade Tree.yaml and Rock.yaml to Tier 1"
      - "Place instances at terrain height, not y=0"

# World generation parameters
decisions:
  slice_size:
    type: count
    min: 10
    max: 100
    default: 50
    description: "Size of world slice (meters)"

  terrain_frequency:
    type: number
    min: 0.01
    max: 0.1
    default: 0.03
    description: "Terrain noise frequency (lower = gentler hills)"

  terrain_amplitude:
    type: number
    min: 0
    max: 10
    default: 3.0
    description: "Terrain height variation (meters)"

  tree_density:
    type: count
    min: 10
    max: 100
    default: 40
    description: "Target number of trees to scatter"

  rock_density:
    type: count
    min: 5
    max: 50
    default: 20
    description: "Target number of rocks to scatter"

measurements:
  # Coordinate-based generation (supports infinite worlds)
  world_seed:
    value: 42
    source: "Master seed for this world"

  slice_x:
    value: 0
    source: "World slice X coordinate (for chunked worlds)"

  slice_z:
    value: 0
    source: "World slice Z coordinate (for chunked worlds)"

  # Terrain settings
  base_height:
    value: 0
    source: "Base terrain height (meters)"

  # Tree variation
  tree_height_min:
    value: 6.0
    source: "Minimum tree height (meters)"

  tree_height_max:
    value: 10.0
    source: "Maximum tree height (meters)"

  tree_width_min:
    value: 0.4
    source: "Minimum tree trunk width (meters)"

  tree_width_max:
    value: 0.8
    source: "Maximum tree trunk width (meters)"

  # Rock variation
  rock_size_min:
    value: 0.5
    source: "Minimum rock size (meters)"

  rock_size_max:
    value: 2.0
    source: "Maximum rock size (meters)"

  # Spacing parameters
  tree_spacing:
    value: 2.5
    source: "Minimum distance between trees (meters)"

  rock_spacing:
    value: 3.0
    source: "Minimum distance between rocks (meters)"

derived:
  # Calculate center point for proper placement
  half_size: "slice_size / 2"

  # Copy decision to measurements for geometry access
  size: "slice_size"

  # Terrain coordinate hashing (for deterministic chunk generation)
  # Simple hash: combine world_seed with coordinates
  chunk_seed: "world_seed + slice_x * 73856093 + slice_z * 19349663"

  # Calculate terrain height at slice center (for visualization)
  terrain_height: "base_height + terrain_amplitude"

# Ground plane with terrain-height vertices
geometry:
  # Ground corners (flat for now - real terrain would query field at each point)
  - vertex: ground_bl
    position: { x: 0, y: 0, z: 0 }

  - vertex: ground_br
    position: { x: "size", y: 0, z: 0 }

  - vertex: ground_tr
    position: { x: "size", y: 0, z: "size" }

  - vertex: ground_tl
    position: { x: 0, y: 0, z: "size" }

  # Ground face
  - face: ground_surface
    vertices: [ground_bl, ground_br, ground_tr, ground_tl]
    color: { name: olive }

# Scattered content - Trees (instanced, not merged)
placement:
  - mode: scatter_poisson
    builder: Tree
    count: "tree_density"
    width: "size"
    depth: "size"
    center: { x: "half_size", y: 0, z: "half_size" }
    minDistance: "tree_spacing"
    instancePrefix: tree
    seed: "chunk_seed + 1"
    asInstance: true
    overrides:
      trunk_height: "tree_height_min"
      trunk_width: "tree_width_min"

  # Rocks scattered separately (different spacing pattern)
  - mode: scatter_poisson
    builder: Rock
    count: "rock_density"
    width: "size"
    depth: "size"
    center: { x: "half_size", y: 0, z: "half_size" }
    minDistance: "rock_spacing"
    instancePrefix: rock
    seed: "chunk_seed + 2"
    asInstance: true
    overrides:
      rock_size: "rock_size_min"

