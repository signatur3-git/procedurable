version: "1.0"
name: SimpleSign
description: Simple sign without text (uses 2D shapes only)
author: AI Agent
tags: [demo, signage, simple]

decisions:
  sign_shape:
    type: choice
    options: [rectangle, circle, hexagon]
    weights: [0.4, 0.3, 0.3]

  sign_size:
    type: choice
    options: [small, medium, large]
    weights: [0.3, 0.4, 0.3]

measurements:
  base_width:
    value: 1.0
    min: 0.5
    max: 2.0
    source: "Sign width in meters"

  base_height:
    value: 0.6
    min: 0.3
    max: 1.2
    source: "Sign height in meters"

  depth:
    value: 0.05
    min: 0.02
    max: 0.1
    source: "Sign depth"

derived:
  size_multiplier: "if(eq(sign_size, 'small'), 0.7, if(eq(sign_size, 'large'), 1.4, 1.0))"
  final_width: "base_width * size_multiplier"
  final_height: "base_height * size_multiplier"

  # Shape-specific dimensions
  circle_radius: "min(final_width, final_height) / 2"

materials:
  wood_sign:
    color: { r: 0.4, g: 0.3, b: 0.2 }

  metal_sign:
    color: { r: 0.3, g: 0.3, b: 0.35 }

shapes:
  rect_shape:
    type: rect
    width: final_width
    height: final_height
    center: { x: 0, z: 0 }

  circle_shape:
    type: circle
    radius: circle_radius
    segments: 32
    center: { x: 0, z: 0 }

  hex_shape:
    type: polygon
    points:
      - { x: "circle_radius * 0.866", z: "circle_radius * 0.5" }
      - { x: 0, z: circle_radius }
      - { x: "-circle_radius * 0.866", z: "circle_radius * 0.5" }
      - { x: "-circle_radius * 0.866", z: "-circle_radius * 0.5" }
      - { x: 0, z: "-circle_radius" }
      - { x: "circle_radius * 0.866", z: "-circle_radius * 0.5" }

geometry:
  - when: "sign_shape == rectangle"
    geometry:
      - extrude2d: sign_plate
        shape: rect_shape
        depth: depth
        caps: both
        bevel:
          size: 0.01
          segments: 2
        color: $wood_sign

  - when: "sign_shape == circle"
    geometry:
      - extrude2d: sign_plate
        shape: circle_shape
        depth: depth
        caps: both
        bevel:
          size: 0.01
          segments: 2
        color: $metal_sign

  - when: "sign_shape == hexagon"
    geometry:
      - extrude2d: sign_plate
        shape: hex_shape
        depth: depth
        caps: both
        bevel:
          size: 0.01
          segments: 2
        color: $wood_sign
