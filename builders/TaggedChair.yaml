version: "1.0"
name: TaggedChair
description: "Demo chair with semantic tags for scene graph queries"
author: "AI Agent"
tags: ["demo", "scene_graph", "semantic"]

quality:
  target_tier: 2
  current_tier: 1
  tier_gaps:
    - "has_armrests decision declared but no armrest geometry exists"
    - "back is a flat face with no thickness"
    - "single material"
  parts:
    seat: { tier: 1, notes: "box" }
    back: { tier: 0, notes: "single flat face" }
    legs: { tier: 1, notes: "lofted cylinders" }
  decision_coverage:
    has_armrests: "unused"
    coverage: "0%"
  upgrade_path:
    - "Implement armrest geometry"
    - "Add back thickness"
    - "Multi-material"
    - "Semantic tags already good"

decisions:
  has_armrests:
    type: boolean
    probability: 0.5

measurements:
  seat_width:
    value: 0.45
  seat_depth:
    value: 0.45
  seat_height:
    value: 0.45
  back_height:
    value: 0.35
  leg_thickness:
    value: 0.03
  armrest_width:
    value: 0.05

derived:
  hw: "seat_width / 2"
  hd: "seat_depth / 2"
  leg_offset: "leg_thickness / 2"

geometry:
  # === SEAT (tagged as 'seating surface') ===
  - vertex: seat_bl_t
    position: { x: "-hw", y: "seat_height", z: "-hd" }
  - vertex: seat_br_t
    position: { x: "hw", y: "seat_height", z: "-hd" }
  - vertex: seat_fr_t
    position: { x: "hw", y: "seat_height", z: "hd" }
  - vertex: seat_fl_t
    position: { x: "-hw", y: "seat_height", z: "hd" }

  - vertex: seat_bl_b
    position: { x: "-hw", y: "seat_height - 0.05", z: "-hd" }
  - vertex: seat_br_b
    position: { x: "hw", y: "seat_height - 0.05", z: "-hd" }
  - vertex: seat_fr_b
    position: { x: "hw", y: "seat_height - 0.05", z: "hd" }
  - vertex: seat_fl_b
    position: { x: "-hw", y: "seat_height - 0.05", z: "hd" }

  # Seat faces with semantic tags
  - face: seat_top
    vertices: [seat_fl_t, seat_fr_t, seat_br_t, seat_bl_t]
    color: { r: 0.6, g: 0.4, b: 0.2 }
    tags: [surface, seating, horizontal, functional]

  - face: seat_bottom
    vertices: [seat_bl_b, seat_br_b, seat_fr_b, seat_fl_b]
    color: { r: 0.5, g: 0.3, b: 0.15 }
    tags: [structure]

  - face: seat_front
    vertices: [seat_fl_t, seat_fr_t, seat_fr_b, seat_fl_b]
    color: { r: 0.5, g: 0.3, b: 0.15 }
    tags: [structure]

  - face: seat_back
    vertices: [seat_br_t, seat_bl_t, seat_bl_b, seat_br_b]
    color: { r: 0.5, g: 0.3, b: 0.15 }
    tags: [structure]

  - face: seat_left
    vertices: [seat_bl_t, seat_fl_t, seat_fl_b, seat_bl_b]
    color: { r: 0.5, g: 0.3, b: 0.15 }
    tags: [structure]

  - face: seat_right
    vertices: [seat_fr_t, seat_br_t, seat_br_b, seat_fr_b]
    color: { r: 0.5, g: 0.3, b: 0.15 }
    tags: [structure]

  # === BACK (tagged as 'back support') ===
  - vertex: back_bl_t
    position: { x: "-hw", y: "seat_height + back_height", z: "-hd" }
  - vertex: back_br_t
    position: { x: "hw", y: "seat_height + back_height", z: "-hd" }
  - vertex: back_bl_b
    position: { x: "-hw", y: "seat_height", z: "-hd" }
  - vertex: back_br_b
    position: { x: "hw", y: "seat_height", z: "-hd" }

  - face: back_front
    vertices: [back_bl_t, back_br_t, back_br_b, back_bl_b]
    color: { r: 0.6, g: 0.4, b: 0.2 }
    tags: [support, back_support, vertical, functional]

  - face: back_back
    vertices: [back_br_b, back_br_t, back_bl_t, back_bl_b]
    color: { r: 0.5, g: 0.3, b: 0.15 }
    tags: [structure]

  # === LEGS (tagged as 'support', 'ground_contact') ===
  # Back Left Leg
  - vertex: leg_bl_t
    position: { x: "-hw + leg_offset", y: "seat_height", z: "-hd + leg_offset" }
  - vertex: leg_bl_b
    position: { x: "-hw + leg_offset", y: 0, z: "-hd + leg_offset" }
    tags: [ground_contact, support, structure]

  - loop: leg_bl_top
    type: circle
    vertices: []
    purpose: structural
  - loop: leg_bl_bottom
    type: circle
    vertices: []
    purpose: structural

  - circle: leg_bl_top
    center: { x: "-hw + leg_offset", y: "seat_height", z: "-hd + leg_offset" }
    radius: leg_thickness
    segments: 8
    purpose: structural
    normal: [0, 1, 0]
    tags: [support, structure]

  - circle: leg_bl_bottom
    center: { x: "-hw + leg_offset", y: 0, z: "-hd + leg_offset" }
    radius: leg_thickness
    segments: 8
    purpose: structural
    normal: [0, 1, 0]
    tags: [support, ground_contact, structure]

  - loft: leg_bl_loft
    from: leg_bl_top
    to: leg_bl_bottom
    color: { r: 0.5, g: 0.3, b: 0.15 }
    tags: [support, structure]

  - cap: leg_bl_cap_top
    loop: leg_bl_top
    flip: true
    color: { r: 0.5, g: 0.3, b: 0.15 }
    tags: [structure]

  - cap: leg_bl_cap_bottom
    loop: leg_bl_bottom
    flip: false
    color: { r: 0.5, g: 0.3, b: 0.15 }
    tags: [ground_contact]

  # Back Right Leg
  - circle: leg_br_top
    center: { x: "hw - leg_offset", y: "seat_height", z: "-hd + leg_offset" }
    radius: leg_thickness
    segments: 8
    purpose: structural
    normal: [0, 1, 0]
    tags: [support, structure]

  - circle: leg_br_bottom
    center: { x: "hw - leg_offset", y: 0, z: "-hd + leg_offset" }
    radius: leg_thickness
    segments: 8
    purpose: structural
    normal: [0, 1, 0]
    tags: [support, ground_contact, structure]

  - loft: leg_br_loft
    from: leg_br_top
    to: leg_br_bottom
    color: { r: 0.5, g: 0.3, b: 0.15 }
    tags: [support, structure]

  - cap: leg_br_cap_top
    loop: leg_br_top
    flip: true
    color: { r: 0.5, g: 0.3, b: 0.15 }
    tags: [structure]

  - cap: leg_br_cap_bottom
    loop: leg_br_bottom
    flip: false
    color: { r: 0.5, g: 0.3, b: 0.15 }
    tags: [ground_contact]

  # Front Right Leg
  - circle: leg_fr_top
    center: { x: "hw - leg_offset", y: "seat_height", z: "hd - leg_offset" }
    radius: leg_thickness
    segments: 8
    purpose: structural
    normal: [0, 1, 0]
    tags: [support, structure]

  - circle: leg_fr_bottom
    center: { x: "hw - leg_offset", y: 0, z: "hd - leg_offset" }
    radius: leg_thickness
    segments: 8
    purpose: structural
    normal: [0, 1, 0]
    tags: [support, ground_contact, structure]

  - loft: leg_fr_loft
    from: leg_fr_top
    to: leg_fr_bottom
    color: { r: 0.5, g: 0.3, b: 0.15 }
    tags: [support, structure]

  - cap: leg_fr_cap_top
    loop: leg_fr_top
    flip: true
    color: { r: 0.5, g: 0.3, b: 0.15 }
    tags: [structure]

  - cap: leg_fr_cap_bottom
    loop: leg_fr_bottom
    flip: false
    color: { r: 0.5, g: 0.3, b: 0.15 }
    tags: [ground_contact]

  # Front Left Leg
  - circle: leg_fl_top
    center: { x: "-hw + leg_offset", y: "seat_height", z: "hd - leg_offset" }
    radius: leg_thickness
    segments: 8
    purpose: structural
    normal: [0, 1, 0]
    tags: [support, structure]

  - circle: leg_fl_bottom
    center: { x: "-hw + leg_offset", y: 0, z: "hd - leg_offset" }
    radius: leg_thickness
    segments: 8
    purpose: structural
    normal: [0, 1, 0]
    tags: [support, ground_contact, structure]

  - loft: leg_fl_loft
    from: leg_fl_top
    to: leg_fl_bottom
    color: { r: 0.5, g: 0.3, b: 0.15 }
    tags: [support, structure]

  - cap: leg_fl_cap_top
    loop: leg_fl_top
    flip: true
    color: { r: 0.5, g: 0.3, b: 0.15 }
    tags: [structure]

  - cap: leg_fl_cap_bottom
    loop: leg_fl_bottom
    flip: false
    color: { r: 0.5, g: 0.3, b: 0.15 }
    tags: [ground_contact]
