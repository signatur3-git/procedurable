version: "1.0"
name: ChairInBounds
description: "Demo builder showing spatial constraints - chair respects max_width, max_depth, max_height from parent"
author: "AI Agent"
tags: ["demo", "constraints", "spatial"]

quality:
  target_tier: 1
  current_tier: 0
  tier_gaps:
    - "All parts are boxes"
    - "No round legs"
    - "No back variation"
    - "Constraint-responsive but primitive shapes"
  parts:
    seat: { tier: 0, notes: "box" }
    back: { tier: 0, notes: "box" }
    legs: { tier: 0, notes: "boxes" }
  decision_coverage:
    constrained: "always true (not really a decision)"
    notes: "Constraint values from parent affect sizing"
    coverage: "0%"
  upgrade_path:
    - "Use lofted cylinders for legs"
    - "Add back variation"
    - "Round seat edges"

decisions:
  # Check if constraints are provided
  constrained:
    type: boolean
    probability: 1.0

measurements:
  # Default dimensions if no constraints provided
  default_width:
    value: 0.5
    source: "default chair width"
  default_depth:
    value: 0.5
    source: "default chair depth"
  default_height:
    value: 0.9
    source: "default chair total height"

  # Chair dimensions with natural variation
  seat_width:
    base: 0.4
    variation: "0.05"
  seat_depth:
    base: 0.4
    variation: "0.05"
  seat_height:
    base: 0.45
    variation: "0.05"
  back_height:
    base: 0.35
    variation: "0.1"
  leg_thickness:
    value: 0.03

derived:
  # Apply constraints if provided (using @ prefix for constraint access)
  # Fallback: @max_width = 999 if not provided (no constraint)
  final_width: "min(seat_width, @max_width)"
  final_depth: "min(seat_depth, @max_depth)"
  final_height: "min(seat_height + back_height, @max_height)"

  # Half measurements for positioning
  hw: "final_width / 2"
  hd: "final_depth / 2"
  leg_offset: "leg_thickness / 2"

geometry:
  # === SEAT ===
  - vertex: seat_bl
    position: { x: "-hw", y: "seat_height", z: "-hd" }
  - vertex: seat_br
    position: { x: "hw", y: "seat_height", z: "-hd" }
  - vertex: seat_fr
    position: { x: "hw", y: "seat_height", z: "hd" }
  - vertex: seat_fl
    position: { x: "-hw", y: "seat_height", z: "hd" }

  - vertex: seat_bl_b
    position: { x: "-hw", y: "seat_height - 0.02", z: "-hd" }
  - vertex: seat_br_b
    position: { x: "hw", y: "seat_height - 0.02", z: "-hd" }
  - vertex: seat_fr_b
    position: { x: "hw", y: "seat_height - 0.02", z: "hd" }
  - vertex: seat_fl_b
    position: { x: "-hw", y: "seat_height - 0.02", z: "hd" }

  # Seat faces
  - face: seat_top
    vertices: [seat_fl, seat_fr, seat_br, seat_bl]
    color: { r: 0.6, g: 0.4, b: 0.2 }
  - face: seat_bottom
    vertices: [seat_bl_b, seat_br_b, seat_fr_b, seat_fl_b]
    color: { r: 0.6, g: 0.4, b: 0.2 }
  - face: seat_front
    vertices: [seat_fl, seat_fr, seat_fr_b, seat_fl_b]
    color: { r: 0.6, g: 0.4, b: 0.2 }
  - face: seat_back
    vertices: [seat_br, seat_bl, seat_bl_b, seat_br_b]
    color: { r: 0.6, g: 0.4, b: 0.2 }
  - face: seat_left
    vertices: [seat_bl, seat_fl, seat_fl_b, seat_bl_b]
    color: { r: 0.6, g: 0.4, b: 0.2 }
  - face: seat_right
    vertices: [seat_fr, seat_br, seat_br_b, seat_fr_b]
    color: { r: 0.6, g: 0.4, b: 0.2 }

  # === BACK REST ===
  - vertex: back_bl
    position: { x: "-hw", y: "seat_height", z: "-hd" }
  - vertex: back_br
    position: { x: "hw", y: "seat_height", z: "-hd" }
  - vertex: back_tl
    position: { x: "-hw", y: "final_height", z: "-hd" }
  - vertex: back_tr
    position: { x: "hw", y: "final_height", z: "-hd" }

  - vertex: back_bl_b
    position: { x: "-hw", y: "seat_height", z: "-hd + 0.02" }
  - vertex: back_br_b
    position: { x: "hw", y: "seat_height", z: "-hd + 0.02" }
  - vertex: back_tl_b
    position: { x: "-hw", y: "final_height", z: "-hd + 0.02" }
  - vertex: back_tr_b
    position: { x: "hw", y: "final_height", z: "-hd + 0.02" }

  # Back faces
  - face: back_front
    vertices: [back_bl, back_br, back_tr, back_tl]
    color: { r: 0.5, g: 0.3, b: 0.15 }
  - face: back_back
    vertices: [back_tl_b, back_tr_b, back_br_b, back_bl_b]
    color: { r: 0.5, g: 0.3, b: 0.15 }
  - face: back_top
    vertices: [back_tl, back_tr, back_tr_b, back_tl_b]
    color: { r: 0.5, g: 0.3, b: 0.15 }
  - face: back_left
    vertices: [back_tl, back_bl, back_bl_b, back_tl_b]
    color: { r: 0.5, g: 0.3, b: 0.15 }
  - face: back_right
    vertices: [back_br, back_tr, back_tr_b, back_br_b]
    color: { r: 0.5, g: 0.3, b: 0.15 }

  # === LEGS (4 simple boxes) ===
  # Front-left leg
  - vertex: leg_fl_t
    position: { x: "-hw + leg_offset", y: "seat_height", z: "hd - leg_offset" }
  - vertex: leg_fl_b
    position: { x: "-hw + leg_offset", y: 0, z: "hd - leg_offset" }
  - vertex: leg_fl_tr
    position: { x: "-hw + leg_offset + leg_thickness", y: "seat_height", z: "hd - leg_offset" }
  - vertex: leg_fl_br
    position: { x: "-hw + leg_offset + leg_thickness", y: 0, z: "hd - leg_offset" }
  - vertex: leg_fl_tf
    position: { x: "-hw + leg_offset", y: "seat_height", z: "hd - leg_offset - leg_thickness" }
  - vertex: leg_fl_bf
    position: { x: "-hw + leg_offset", y: 0, z: "hd - leg_offset - leg_thickness" }
  - vertex: leg_fl_trf
    position: { x: "-hw + leg_offset + leg_thickness", y: "seat_height", z: "hd - leg_offset - leg_thickness" }
  - vertex: leg_fl_brf
    position: { x: "-hw + leg_offset + leg_thickness", y: 0, z: "hd - leg_offset - leg_thickness" }

  - face: leg_fl_top
    vertices: [leg_fl_t, leg_fl_tr, leg_fl_trf, leg_fl_tf]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_fl_bottom
    vertices: [leg_fl_bf, leg_fl_brf, leg_fl_br, leg_fl_b]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_fl_front
    vertices: [leg_fl_t, leg_fl_b, leg_fl_br, leg_fl_tr]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_fl_back
    vertices: [leg_fl_tf, leg_fl_trf, leg_fl_brf, leg_fl_bf]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_fl_left
    vertices: [leg_fl_tf, leg_fl_bf, leg_fl_b, leg_fl_t]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_fl_right
    vertices: [leg_fl_tr, leg_fl_br, leg_fl_brf, leg_fl_trf]
    color: { r: 0.4, g: 0.25, b: 0.1 }

  # Front-right leg
  - vertex: leg_fr_t
    position: { x: "hw - leg_offset - leg_thickness", y: "seat_height", z: "hd - leg_offset" }
  - vertex: leg_fr_b
    position: { x: "hw - leg_offset - leg_thickness", y: 0, z: "hd - leg_offset" }
  - vertex: leg_fr_tr
    position: { x: "hw - leg_offset", y: "seat_height", z: "hd - leg_offset" }
  - vertex: leg_fr_br
    position: { x: "hw - leg_offset", y: 0, z: "hd - leg_offset" }
  - vertex: leg_fr_tf
    position: { x: "hw - leg_offset - leg_thickness", y: "seat_height", z: "hd - leg_offset - leg_thickness" }
  - vertex: leg_fr_bf
    position: { x: "hw - leg_offset - leg_thickness", y: 0, z: "hd - leg_offset - leg_thickness" }
  - vertex: leg_fr_trf
    position: { x: "hw - leg_offset", y: "seat_height", z: "hd - leg_offset - leg_thickness" }
  - vertex: leg_fr_brf
    position: { x: "hw - leg_offset", y: 0, z: "hd - leg_offset - leg_thickness" }

  - face: leg_fr_top
    vertices: [leg_fr_t, leg_fr_tr, leg_fr_trf, leg_fr_tf]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_fr_bottom
    vertices: [leg_fr_bf, leg_fr_brf, leg_fr_br, leg_fr_b]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_fr_front
    vertices: [leg_fr_t, leg_fr_b, leg_fr_br, leg_fr_tr]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_fr_back
    vertices: [leg_fr_tf, leg_fr_trf, leg_fr_brf, leg_fr_bf]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_fr_left
    vertices: [leg_fr_tf, leg_fr_bf, leg_fr_b, leg_fr_t]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_fr_right
    vertices: [leg_fr_tr, leg_fr_br, leg_fr_brf, leg_fr_trf]
    color: { r: 0.4, g: 0.25, b: 0.1 }

  # Back-left leg
  - vertex: leg_bl_t
    position: { x: "-hw + leg_offset", y: "seat_height", z: "-hd + leg_offset + leg_thickness" }
  - vertex: leg_bl_b
    position: { x: "-hw + leg_offset", y: 0, z: "-hd + leg_offset + leg_thickness" }
  - vertex: leg_bl_tr
    position: { x: "-hw + leg_offset + leg_thickness", y: "seat_height", z: "-hd + leg_offset + leg_thickness" }
  - vertex: leg_bl_br
    position: { x: "-hw + leg_offset + leg_thickness", y: 0, z: "-hd + leg_offset + leg_thickness" }
  - vertex: leg_bl_tf
    position: { x: "-hw + leg_offset", y: "seat_height", z: "-hd + leg_offset" }
  - vertex: leg_bl_bf
    position: { x: "-hw + leg_offset", y: 0, z: "-hd + leg_offset" }
  - vertex: leg_bl_trf
    position: { x: "-hw + leg_offset + leg_thickness", y: "seat_height", z: "-hd + leg_offset" }
  - vertex: leg_bl_brf
    position: { x: "-hw + leg_offset + leg_thickness", y: 0, z: "-hd + leg_offset" }

  - face: leg_bl_top
    vertices: [leg_bl_t, leg_bl_tr, leg_bl_trf, leg_bl_tf]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_bl_bottom
    vertices: [leg_bl_bf, leg_bl_brf, leg_bl_br, leg_bl_b]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_bl_front
    vertices: [leg_bl_t, leg_bl_b, leg_bl_br, leg_bl_tr]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_bl_back
    vertices: [leg_bl_tf, leg_bl_trf, leg_bl_brf, leg_bl_bf]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_bl_left
    vertices: [leg_bl_tf, leg_bl_bf, leg_bl_b, leg_bl_t]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_bl_right
    vertices: [leg_bl_tr, leg_bl_br, leg_bl_brf, leg_bl_trf]
    color: { r: 0.4, g: 0.25, b: 0.1 }

  # Back-right leg
  - vertex: leg_br_t
    position: { x: "hw - leg_offset - leg_thickness", y: "seat_height", z: "-hd + leg_offset + leg_thickness" }
  - vertex: leg_br_b
    position: { x: "hw - leg_offset - leg_thickness", y: 0, z: "-hd + leg_offset + leg_thickness" }
  - vertex: leg_br_tr
    position: { x: "hw - leg_offset", y: "seat_height", z: "-hd + leg_offset + leg_thickness" }
  - vertex: leg_br_br
    position: { x: "hw - leg_offset", y: 0, z: "-hd + leg_offset + leg_thickness" }
  - vertex: leg_br_tf
    position: { x: "hw - leg_offset - leg_thickness", y: "seat_height", z: "-hd + leg_offset" }
  - vertex: leg_br_bf
    position: { x: "hw - leg_offset - leg_thickness", y: 0, z: "-hd + leg_offset" }
  - vertex: leg_br_trf
    position: { x: "hw - leg_offset", y: "seat_height", z: "-hd + leg_offset" }
  - vertex: leg_br_brf
    position: { x: "hw - leg_offset", y: 0, z: "-hd + leg_offset" }

  - face: leg_br_top
    vertices: [leg_br_t, leg_br_tr, leg_br_trf, leg_br_tf]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_br_bottom
    vertices: [leg_br_bf, leg_br_brf, leg_br_br, leg_br_b]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_br_front
    vertices: [leg_br_t, leg_br_b, leg_br_br, leg_br_tr]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_br_back
    vertices: [leg_br_tf, leg_br_trf, leg_br_brf, leg_br_bf]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_br_left
    vertices: [leg_br_tf, leg_br_bf, leg_br_b, leg_br_t]
    color: { r: 0.4, g: 0.25, b: 0.1 }
  - face: leg_br_right
    vertices: [leg_br_tr, leg_br_br, leg_br_brf, leg_br_trf]
    color: { r: 0.4, g: 0.25, b: 0.1 }
