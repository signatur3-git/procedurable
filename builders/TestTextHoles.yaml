version: "1.0"
name: TestTextHoles
description: Test builder to verify glyph holes work correctly (letters A, O, P, etc.)
author: System
tags: [test, text, holes]

measurements:
  text_size:
    value: 1.0
    source: "Text height"

  extrude_depth:
    value: 0.2
    source: "Text depth"

materials:
  text_color:
    color: { r: 0.2, g: 0.4, b: 0.8 }

shapes:
  test_text:
    type: text
    content: "AOPQR"
    font: "procedural_block"  # Using procedural font as fallback
    size: text_size
    spacing: 0.1
    center: { x: 0, z: 0 }

geometry:
  - extrude2d: text_extrude
    shape: test_text
    depth: extrude_depth
    caps: both
    color: $text_color
